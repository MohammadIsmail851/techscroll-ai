name: TechScroll AI CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm run postinstall

      - name: Run Test Suites (Client & Server)
        run: npm test

      - name: Run Frontend Production Build Check
        run: npm run build
